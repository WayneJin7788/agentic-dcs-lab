[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-dcs-lab"
version = "0.2.0"
description = "Governed simulation and read-only shadow architecture for agentic power-plant control research"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "Agentic DCS Lab contributors" }]
keywords = ["DCS", "industrial-control", "power-plant", "agents", "digital-twin", "OT-safety"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Scientific/Engineering",
]

[project.scripts]
agentic-dcs = "agentic_dcs.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_dcs"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
