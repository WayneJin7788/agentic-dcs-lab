name: Bug report
description: Report a reproducible defect in simulation or tooling
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: "Do not include real plant data, credentials, point lists, or network details."
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Include a minimal synthetic reproducer.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Data and safety confirmation
      options:
        - label: I used only synthetic or approved redistributable data.
          required: true
        - label: This report does not expose an operational control system.
          required: true

